[project]
name = "sw-visualize-texture-maker"
version = "1.0.0"
description = "Drop a photo, get a SOLIDWORKS Visualize (.svap) appearance. Windows desktop app."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Teng Maceren" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy>=1.11", "Pillow>=10.0", "PySide6>=6.7"]

[project.urls]
Homepage = "https://github.com/TengKo/sw-visualize-texture-maker"

[project.gui-scripts]
sw-visualize-texture-maker = "texture_maker.app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
