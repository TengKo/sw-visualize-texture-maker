name: Build Windows app

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Build app folder
        env:
          TM_ONEFILE: "0"
        run: pyinstaller --noconfirm --clean packaging/texture_maker.spec

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue)) {
            choco install innosetup --no-progress -y
          }

      - name: Build installer
        shell: pwsh
        run: ./packaging/build_installer.ps1

      - name: Test installer (install, self-test, uninstall)
        shell: pwsh
        run: ./packaging/test_installer.ps1 -OutDir (Join-Path $env:RUNNER_TEMP "installer-test")

      - name: Zip portable folder
        shell: pwsh
        run: Compress-Archive -Path "dist\SW-Visualize-Texture-Maker\*" -DestinationPath "dist\SW-Visualize-Texture-Maker-portable.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: SW-Visualize-Texture-Maker-windows
          path: |
            dist/SW-Visualize-Texture-Maker-Setup.exe
            dist/SW-Visualize-Texture-Maker-portable.zip
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/SW-Visualize-Texture-Maker-Setup.exe
            dist/SW-Visualize-Texture-Maker-portable.zip
          generate_release_notes: true
