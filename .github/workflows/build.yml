name: Build Windows app

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Build one-file .exe
        run: pyinstaller --noconfirm --clean --workpath build/onefile packaging/texture_maker.spec

      - name: Build portable folder
        env:
          TM_ONEFILE: "0"
        run: pyinstaller --noconfirm --clean --workpath build/folder packaging/texture_maker.spec

      - name: Self-test the built .exe
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP "selftest"
          $p = Start-Process -FilePath "dist\SW-Visualize-Texture-Maker.exe" -ArgumentList "--self-test", $out -Wait -PassThru
          Get-Content (Join-Path $out "self_test.json")
          if ($p.ExitCode -ne 0) { throw "Self-test failed (exit code $($p.ExitCode))" }

      - name: Zip portable folder
        shell: pwsh
        run: Compress-Archive -Path "dist\SW-Visualize-Texture-Maker\*" -DestinationPath "dist\SW-Visualize-Texture-Maker-portable.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: SW-Visualize-Texture-Maker-windows
          path: |
            dist/SW-Visualize-Texture-Maker.exe
            dist/SW-Visualize-Texture-Maker-portable.zip
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/SW-Visualize-Texture-Maker.exe
            dist/SW-Visualize-Texture-Maker-portable.zip
          generate_release_notes: true
